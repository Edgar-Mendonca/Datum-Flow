name: Nightly
# The heavy checks (the build budget, FAMILY §9): release-mode solver tests with the full
# verification suite, the Windows build and tests, and the UI tests. Every night when something
# changed in the last day, and by hand (Actions › Nightly › Run workflow).
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Nothing new since yesterday: nothing to do.
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.look.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: look
        run: |
          N=$(git log --since="25 hours ago" --oneline | wc -l)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$N" -gt 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
          echo "$N commit(s) in the last 25 hours"

  # The whole verification suite in release mode (solvers are slow without optimisation).
  verification:
    needs: changed
    if: needs.changed.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update && sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: cargo test --workspace --release -- --include-ignored

  # The window, driven in a browser with the real model engine behind it.
  ui:
    needs: changed
    if: needs.changed.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UI tests (Playwright)
        run: |
          npm i -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          npm run fixture
          npm run build:ui
          NODE_PATH=$(npm root -g) node tests_ui/run.cjs

  # Datum ships for Windows: the engine and the app build and pass their tests there.
  windows:
    needs: changed
    if: needs.changed.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: cargo test --workspace --release
