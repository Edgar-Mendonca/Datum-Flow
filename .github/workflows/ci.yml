name: CI
# The fast check on every push to main and every pull request (the build budget, FAMILY §9):
# one Linux job, debug build. Run the same checks locally before pushing; this is the safety
# net. The heavy work (release-mode solver tests, the Windows build, the UI tests) is in
# nightly.yml and release.yml.
on:
  push:
    branches: [main]
    # Words only (docs, changelog, notes) do not need the engine rebuilt.
    paths-ignore: ["docs/**", "**.md", "NOTICE", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "NOTICE", "LICENSE"]

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Give up quickly when the package mirrors do not answer, instead of hanging.
      - name: System libraries for Tauri
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update && sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:ui
      - run: npm run build:ui
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Slow verification cases are #[ignore]d here and run nightly and before a release.
      - run: cargo test --workspace

  # Licences, security advisories and crate sources (deny.toml): never GPL or AGPL.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
