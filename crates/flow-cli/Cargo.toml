[package]
name = "flow-cli"
description = "Datum Flow engine: the session the window and the command line share (mesh, check, solve, read results), and the command-line tool."
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "flow_cli"
path = "src/lib.rs"

[[bin]]
name = "flow-cli"
